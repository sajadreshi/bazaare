name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bazaare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret
      PG_URL: postgresql://postgres:postgres@localhost:5432/bazaare_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL)
        run: TEST_DATABASE_URL=$PG_URL python -m pytest -q
      - name: Migrations upgrade, downgrade, upgrade (PostgreSQL)
        run: |
          export DATABASE_URL=$PG_URL
          psql "$PG_URL" -c 'drop schema public cascade; create schema public;'
          flask --app server db upgrade
          flask --app server db downgrade 7f1820355e10
          flask --app server db upgrade
      - name: Models and migrations agree (PostgreSQL)
        run: |
          export DATABASE_URL=$PG_URL
          flask --app server db migrate -m ci-check 2>&1 | tee migrate.log
          grep -q "No changes in schema detected" migrate.log
