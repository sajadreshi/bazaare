<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="{% block meta_description %}BazaarE' – handcrafted jewellery inspired by Indian craft and culture: jhumkas, chandbalis, haslis, kadas and more.{% endblock %}" />
		<link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.png') }}">
		<title>{% block title %}{% endblock %} · BazaarE'</title>
		<link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/bootstrap.css')}}" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-nice-select/1.1.0/css/nice-select.min.css" integrity="sha512-CruCP+TD3yXzlvvijET8wV5WxxEh5H8P4cmz0RFbKK6FlZ2sYl3AEsKlLPHbniXKSrDdFewhbmBK5skbdsASbQ==" crossorigin="anonymous" />
		<link href="{{ url_for('static',filename='css/font-awesome.min.css') }}" rel="stylesheet" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
		<link href="{{ url_for('static',filename='css/responsive.css') }}" rel="stylesheet" />
		<link rel="stylesheet" href="{{ url_for('static', filename='css/bazaare.css') }}">
	</head>
	<body class="bz-body {% block body_class %}{% endblock %}">
		{% block header %}{% endblock %}
		<main class="bz-main">{% block content %}{% endblock %}</main>
		{% block footer %}{% endblock %}
		<script src="{{ url_for('static', filename='js/bazaare.js') }}" defer></script>
	</body>
</html>
