 <!-- header section strats -->
 <header class="header_section">
    <div class="container">
      <nav class="navbar navbar-expand-lg custom_nav-container ">
        <a class="navbar-brand" href="{{ url_for('main.home') }}">
          <span>
            Bazaare
          </span>
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class=""> </span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav  mx-auto ">
            <li class="nav-item active">
              <a class="nav-link" href="{{ url_for('main.home') }}">Home <span class="sr-only">(current)</span></a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('catalog.collection') }}">Collection</a> 
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('main.about') }}">About</a> 
            </li>
         
          {%  if current_user.is_authenticated %}
              
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('customer.profile') }}">Account</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('auth.logout') }}">Logout</a>
            </li>

          {% else %}
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('auth.login') }}">Login</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('auth.register') }}">Register</a>
            </li>
          {% endif %}
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('checkout.shopcart') }}"  id="cart"><i class="fa fa-shopping-cart"></i> Cart <span class="badge  badge-warning">{{ cart_item_count() }}</span></a>
            </li>
          </ul>
        </div>
      </nav>
    </div>
  </header>
