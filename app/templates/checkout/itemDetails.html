<div class="cart-table-wrap">
    <table class="cart-table">
        <tbody>
            {% for item in cart.pending_items %}
            {% set item_id = item.id %}
            <tr class="table-body-row">
                <td class="product-image"><img src="{{ url_for('static', filename='images/' + ((item.product.main_image if item.product else None) or 'default.jpg')) }}" alt="{{ item.product_name }}">
                </td>
                <td><span class="td-content">{{ item.product_name }}</span><br>
                    <span class="td-content">${{ item.product_price }}</span><br>
                    <span class="td-content"><form method="post" action="{{ url_for('checkout.remove', itemId=item.id) }}" class="d-inline">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="btn btn-link p-0"><i class="fa fa-trash" aria-hidden="true"> Remove</i></button>
                    </form></span>
                    <div class="size-display" id="size-display-{{item_id}}" style="display: block;">
                        <span class="td-content">{{ item.variant.size if item.variant else '' }}</span><br>
                        <span class="td-content"><a href="javascript:eidt_item_size({{item_id}})">
                               <i class="fa fa-edit"  aria-hidden="true"></i> Edit</a></span>
                        <span class="td-content" id="error-display-{{item_id}}" style="color: red;"></span><br>
                    </div>
                    <div class="size-update" id="size-update-{{item_id}}" style="display: none;">
                        {% include 'checkout/updateSizeForm.html'%}
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
