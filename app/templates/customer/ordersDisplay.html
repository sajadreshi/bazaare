<div class="checkout-section mt-150 mb-150">
    <div class="container">
        <div class="row">
            <div class="col-lg-8">
                <div class="checkout-accordion-wrap">
                    <div class="accordion" id="accordionExample">
                        <div class="worked checkout-sec" id="ship-worked">
                            <div class="completed-sec">
                                <h5 class="mb-0">
                                    <span class="heading"> Orders</span>
                                </h5>
                                <div class="card-body">
                                    {% if orders %}
                                    <div class="cart-table-wrap">
                                        <table class="cart-table">
                                            <tbody>
                                                {% for order in orders%}
                                                <tr class="table-body-row text-center">
                                                    <td class="td-content">
                                                        <dl class="row">
                                                            <dt class="col">Order Number</dt>
                                                            <dd class="col">
                                                                <a href="{{ url_for('customer.orderDetails',orderId=order.id) }}">
                                                                    {{order.id}}
                                                                </a>
                                                            </dd>
                                                        </dl>
                                                        <dl class="row">
                                                            <dt class="col">Status</dt>
                                                            <dd class="col"> {{order.status}}</dd>
                                                        </dl>
                                                        <dl class="row">
                                                            <dt class="col">Order Date</dt>
                                                            <dd class="col">{{order.updated_at.strftime('%m-%d-%Y') }}</dd>
                                                        </dl>
                                                    </td>
                                                </tr>
                                                {% endfor %}
                                            </tbody>
                                        </table>
                                    </div>
                                    {% endif %}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
