<div class="offer_container">
  <div class="container">
    <div class="row">
      {% for product in home.featured %}
      <div class="col-md-6">
        <div class="box">
          <div class="img-box">
            <img src="{{ url_for('static', filename='images/' + (product.main_image or 'default.jpg')) }}" alt="{{ product.name }}">
          </div>
          <div class="detail-box">
            <h3>{{ product.name }}</h3>
            <h2>${{ product.sale_price }}</h2>
            <a href="{{ url_for('catalog.product', productId=product.id) }}">Shop Now</a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
