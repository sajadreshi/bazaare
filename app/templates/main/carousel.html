<div id="customCarousel1" class="carousel slide" data-ride="carousel">
  <div class="carousel-inner">
    {% for slide in home.slides %}
    <div class="carousel-item {{ 'active' if loop.first else '' }}">
      <div class="container">
        <div class="row">
          <div class="col-md-7 col-lg-6">
            <div class="detail-box">
              <h1>{{ slide.header }}</h1>
              {# Slide text comes from the admin's rich-text editor; show it as plain text. #}
              <p>{{ slide.text | striptags }}</p>
              <div class="btn-box">
                <a href="{{ url_for('catalog.collection') }}" class="btn1">Shop Now</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
  {% if home.slides | length > 1 %}
  <div class="container">
    <ol class="carousel-indicators">
      {% for slide in home.slides %}
      <li data-target="#customCarousel1" data-slide-to="{{ loop.index0 }}" class="{{ 'active' if loop.first else '' }}"></li>
      {% endfor %}
    </ol>
  </div>
  {% endif %}
</div>
