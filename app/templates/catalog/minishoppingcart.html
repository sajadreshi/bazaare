{# Mini cart shown after adding to cart. `cart` is a Cart model. #}
<div class="shopping-cart">
    <div class="shopping-cart-header">
        <i class="fa fa-shopping-cart cart-icon"></i><span class="dollar-amount">Total : ${{ cart.total_cart }}</span>
    </div>
    <div class="min-shopcart-products">
        <ul class="shopping-cart-items">
            {% for item in cart.pending_items %}
            <li class="clearfix">
                <img class="rounded-2 alt-img" src="{{ url_for('static', filename='images/' + ((item.product.main_image if item.product else None) or 'default.jpg')) }}"
                    alt="{{ item.product_name }}" />
                <span class="item-name">{{ item.product_name }}</span>
                <span class="item-price">${{ item.product_price }}</span>
                <span class="item-quantity">{{ item.variant.size if item.variant else '' }}</span>
                <div class="remove-item">
                <form method="post" action="{{ url_for('checkout.remove', itemId=item.id) }}" class="d-inline">
                  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                  <button type="submit" class="btn btn-link p-0"><i class="fa fa-trash" aria-hidden="true"></i><span> Remove </span></button>
                </form>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
     <div style="position: relative;">
        <a href="{{ url_for('checkout.shopcart') }}" class="button">Checkout</a>
        <a href="javascript:void(0)" class="button cont_shopping">Continue Shopping</a>
    </div>
</div>
