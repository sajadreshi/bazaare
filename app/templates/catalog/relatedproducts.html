{# Cross-sell cards. Expects `xsells` (list of Product). #}
<div class="more-products mb-150">
  <div class="container">
    <div class="row">
      <div class="col-lg-8 offset-lg-2 text-center">
        <div class="section-title">
          <h3><span class="orange-text">Related Products</span></h3>
        </div>
      </div>
    </div>
    <div class="row">
      {% for xsell in xsells %}
      <div class="col-lg-4 col-md-6 text-center">
        <form name="addToCartFrm" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="pid" value="{{ xsell.id }}">
          <div class="box">
            <div class="img-box">
              <a href="{{ url_for('catalog.product', productId=xsell.id) }}">
                <img src="{{ image_url(xsell.main_image) }}" alt="{{ xsell.name }}">
              </a>
            </div>
            <h5>{{ xsell.name }}</h5>
            <p class="product-price"><span>${{ xsell.sale_price }}</span></p>
            <button type="submit" class="btn btn-primary shadow-0"><i class="me-1 fa fa-shopping-basket"></i> Add to cart</button>
          </div>
        </form>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
